name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run security:check
      - run: npm run build
      - run: npm run release:check
      - name: Publish release archive and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dist/profile-downloader-${version}.zip"
          checksum="${archive}.sha256"
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$notes" || ! -s "$notes" ]]; then
            printf '发布失败：缺少非空发布说明文件 %s。\n' "$notes" >&2
            exit 1
          fi
          first_line=''
          IFS= read -r first_line < "$notes" || [[ -n "$first_line" ]]
          first_line="${first_line%$'\r'}"
          h1_pattern='^#[[:blank:]]+(.*)$'
          if [[ ! "$first_line" =~ $h1_pattern ]]; then
            printf '发布失败：%s 首行必须是 Markdown H1（# 发布标题）。\n' "$notes" >&2
            exit 1
          fi
          title="$(printf '%s' "${BASH_REMATCH[1]}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$title" ]]; then
            printf '发布失败：%s 首行的发布标题不能为空。\n' "$notes" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" "$checksum" --verify-tag --title "$title" --notes-file "$notes"
